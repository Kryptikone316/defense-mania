# Picture tuning for Defense Mania on the Data Frog SF3500. Edit, save, relaunch the game.
# The colours are worked out once, while a map loads, so this costs nothing while playing.
#
# brightness  -100 .. 100   0 = unchanged   (higher = lighter)
# contrast     0 .. 200     100 = unchanged (higher = darker darks, brighter lights)
# saturation   0 .. 200     100 = unchanged (higher = stronger colours, 0 = grey)
# gamma        0.5 .. 2.5   1.0 = unchanged (higher = lighter midtones, lower = deeper midtones)
#
# A value can be set for one map by putting its name in front:
#   mountains_  maze_  woods_  river_side_  bigger_
# for example "woods_saturation = 130" changes only Dark Woods.
brightness = 0
contrast = 112
saturation = 115
gamma = 1.0
woods_contrast = 120
woods_saturation = 125

# Menu options, also in Options on the title screen: 1 = on
show_fps = 0
hq_graphics = 0
